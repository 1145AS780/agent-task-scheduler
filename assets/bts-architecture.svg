        --bts-ink-4: #768390;
        --bts-ink-5: #636e7b;
        --bts-hair: #21262d;
        --bts-div: #30363d;
      }
    }
    .n-bg { fill: var(--bts-bg); }
    .n-frame { fill: none; stroke: var(--bts-line); }
    .n-st { stroke: var(--bts-line); }
    .n-st-mute { stroke: var(--bts-ink-4); }
    .n-st-hair { stroke: var(--bts-hair); }
    .n-st-div { stroke: var(--bts-div); }
    .n-ink { fill: var(--bts-ink); }
    .n-ink2 { fill: var(--bts-ink-2); }
    .n-ink3 { fill: var(--bts-ink-3); }
    .n-ink4 { fill: var(--bts-ink-4); }
    .n-ink5 { fill: var(--bts-ink-5); }
    .n-mark { fill: var(--bts-line); }
    .n-box { fill: none; stroke: var(--bts-line); }
    .n-solid { fill: var(--bts-ink); stroke: var(--bts-line); }
    .n-hollow { fill: none; stroke: var(--bts-line); }
  </style>

