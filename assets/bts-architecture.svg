      --bts-line: #000000;
      --bts-ink: #000000;
      --bts-ink-2: #333333;
      --bts-ink-3: #555555;
      --bts-ink-4: #777777;
      --bts-ink-5: #999999;
      --bts-hair: #e5e5e5;
      --bts-div: #bbbbbb;
    }
    @media (prefers-color-scheme: dark) {
      .bts-arch {
        --bts-bg: #0d1117;
        --bts-line: #c9d1d9;
        --bts-ink: #e6edf3;
        --bts-ink-2: #adbac7;
