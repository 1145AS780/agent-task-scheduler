  <text class="n-ink" x="700" y="626" font-size="12" font-weight="bold" letter-spacing="1">判定顺序（短路即决）</text>
  <g class="n-ink2" font-size="10">
    <text x="700" y="656">1  白名单放行 → allow_rules 命中即允许，优先于等级</text>
    <text x="700" y="682">2  策略上限 → level &gt; max_level 直接拒绝</text>
    <text x="700" y="708">3  身份上限 → level ≤ actor_level 直接允许</text>
    <text x="700" y="734">4  存活租约免审 → 租约存活且命中白名单 → 免审</text>
    <text x="700" y="760">5  审批 → 无有效审批则 approval_required</text>
  </g>

  <text class="n-ink" x="1160" y="626" font-size="12" font-weight="bold" letter-spacing="1">等级 L0 → L3</text>
  <g class="n-ink2" font-size="10">
