<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 830" width="1500" height="830" class="ats-arch" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <style>
    .ats-arch {
      --ats-bg: #ffffff;
      --ats-line: #000000;
      --ats-ink: #000000;
      --ats-ink-2: #333333;
      --ats-ink-3: #555555;
      --ats-ink-4: #777777;
      --ats-ink-5: #999999;
      --ats-hair: #e5e5e5;
      --ats-div: #bbbbbb;
    }
    @media (prefers-color-scheme: dark) {
      .ats-arch {
        --ats-bg: #0d1117;
        --ats-line: #c9d1d9;
        --ats-ink: #e6edf3;
        --ats-ink-2: #adbac7;
        --ats-ink-3: #909dab;
        --ats-ink-4: #768390;
        --ats-ink-5: #636e7b;
        --ats-hair: #21262d;
        --ats-div: #30363d;
      }
    }
    .n-bg { fill: var(--ats-bg); }
    .n-frame { fill: none; stroke: var(--ats-line); }
    .n-st { stroke: var(--ats-line); }
    .n-st-mute { stroke: var(--ats-ink-4); }
    .n-st-hair { stroke: var(--ats-hair); }
    .n-st-div { stroke: var(--ats-div); }
    .n-ink { fill: var(--ats-ink); }
    .n-ink2 { fill: var(--ats-ink-2); }
    .n-ink3 { fill: var(--ats-ink-3); }
    .n-ink4 { fill: var(--ats-ink-4); }
    .n-ink5 { fill: var(--ats-ink-5); }
    .n-mark { fill: var(--ats-line); }
    .n-box { fill: none; stroke: var(--ats-line); }
    .n-solid { fill: var(--ats-ink); stroke: var(--ats-line); }
    .n-hollow { fill: none; stroke: var(--ats-line); }
  </style>

