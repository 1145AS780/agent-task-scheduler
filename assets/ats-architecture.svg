  <text class="n-ink2" x="96" y="744" font-size="10">Broken line + ✕ · direct deny, no remediation</text>

  <g class="n-st" stroke-width="1.4" fill="none">
    <path d="M68,762 L78,762 L78,772 Q73,780 68,772 Z"/>
  </g>
  <text class="n-ink2" x="96" y="772" font-size="10">Shield · Permission Gate: five checks in series, short-circuit decides</text>

  <text class="n-ink" x="700" y="626" font-size="12" font-weight="bold" letter-spacing="1">Check order (short-circuit decides)</text>
  <g class="n-ink2" font-size="10">
    <text x="700" y="656">1  Whitelist → allow_rules match allows, ahead of level</text>
    <text x="700" y="682">2  Level cap → level &gt; max_level denies</text>
    <text x="700" y="708">3  Actor cap → level ≤ actor_level allows</text>
    <text x="700" y="734">4  Lease auto-approval → live lease + whitelist match → skip approval</text>
    <text x="700" y="760">5  Approval → approval_required when none is valid</text>
  </g>

  <text class="n-ink" x="1160" y="626" font-size="12" font-weight="bold" letter-spacing="1">Levels L0 → L3</text>
  <g class="n-ink2" font-size="10">
    <text x="1160" y="656">L0  Read-only · no side effects</text>
    <text x="1160" y="682">L1  Recoverable writes</text>
    <text x="1160" y="708">L2  External impact</text>
    <text x="1160" y="734">L3  Irreversible / high risk</text>
  </g>
  <g class="n-st" stroke-width="1.4" fill="none">
