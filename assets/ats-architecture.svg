  <circle class="n-solid" cx="76" cy="652" r="6" stroke-width="1.4"/>
  <text class="n-ink2" x="96" y="656" font-size="10">Solid node · allowed; task passes the gate into execution</text>

  <circle class="n-hollow" cx="76" cy="678" r="6" stroke-width="1.6"/>
  <text class="n-ink2" x="96" y="682" font-size="10">Hollow node · blocked; falls back to approval</text>

  <circle class="n-st" cx="76" cy="704" r="9" fill="none" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="n-ink2" x="96" y="708" font-size="10">Dashed rings · inner = Live Lease; outer = max_level hard boundary</text>

